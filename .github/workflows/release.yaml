name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release candidate
        id: release
        shell: bash
        run: |
          package_version="$(sed -n 's/^version: //p' cli/pubspec.yaml)"
          generated_version="$(sed -n "s/^const packageVersion = '\([^']*\)';/\1/p" cli/lib/src/version.dart)"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Package version must use the X.Y.Z format." >&2
            exit 1
          fi
          if [[ "$package_version" != "$generated_version" ]]; then
            echo "pubspec ($package_version) and generated version ($generated_version) must match." >&2
            exit 1
          fi

          release_tag="v${package_version}"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$release_tag" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match package version $package_version." >&2
              exit 1
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse --quiet --verify "refs/tags/$release_tag" >/dev/null; then
            echo "$release_tag already exists; no release is needed."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1.8.0
        with:
          sdk: "3.12.0"

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Test
        run: dart test

  build:
    name: Build ${{ matrix.asset }}
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: alfredo-linux-x64
            executable: alfredo
            target_os: linux
            target_arch: x64
            archive: tar
            extension: tar.gz
          - runner: ubuntu-latest
            asset: alfredo-linux-arm64
            executable: alfredo
            target_os: linux
            target_arch: arm64
            archive: tar
            extension: tar.gz
          - runner: macos-15-intel
            asset: alfredo-macos-x64
            executable: alfredo
            archive: tar
            extension: tar.gz
          - runner: macos-14
            asset: alfredo-macos-arm64
            executable: alfredo
            archive: tar
            extension: tar.gz
          - runner: windows-latest
            asset: alfredo-windows-x64
            executable: alfredo.exe
            archive: zip
            extension: zip
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1.8.0
        with:
          sdk: "3.12.0"

      - name: Install dependencies
        run: dart pub get

      - name: Create build directory
        shell: bash
        run: mkdir -p build

      - name: Compile Linux executable
        if: matrix.target_os == 'linux'
        shell: bash
        run: >-
          dart compile exe
          --target-os=${{ matrix.target_os }}
          --target-arch=${{ matrix.target_arch }}
          -o build/${{ matrix.executable }}
          bin/alfredo.dart

      - name: Compile native executable
        if: matrix.target_os != 'linux'
        shell: bash
        run: dart compile exe bin/alfredo.dart -o build/${{ matrix.executable }}

      - name: Package Unix executable
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          chmod +x build/alfredo
          tar -C build -czf ${{ matrix.asset }}.tar.gz alfredo

      - name: Package Windows executable
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path build/alfredo.exe -DestinationPath ${{ matrix.asset }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: cli/${{ matrix.asset }}.${{ matrix.extension }}
          if-no-files-found: error

  tag:
    name: Create release tag
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create annotated tag after successful builds
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          release_tag="${{ needs.prepare.outputs.release_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$release_tag" --message "$release_tag"
          git push origin "$release_tag"

  publish:
    name: Publish GitHub release
    needs: [prepare, build, tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate changelog and checksums
        shell: bash
        run: |
          release_tag="${{ needs.prepare.outputs.release_tag }}"
          previous_tag="$(git describe --tags --abbrev=0 "${release_tag}^" 2>/dev/null || true)"
          GITHUB_REF_NAME="$release_tag" scripts/generate-release-notes.sh "$previous_tag" RELEASE_NOTES.md
          cd dist
          sha256sum alfredo-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ needs.prepare.outputs.release_tag }}"
          dist/*
          --verify-tag
          --latest
          --title "Alfredo ${{ needs.prepare.outputs.release_tag }}"
          --notes-file RELEASE_NOTES.md
