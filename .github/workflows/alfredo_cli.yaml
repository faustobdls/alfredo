name: alfredo_cli

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/alfredo_cli.yaml"
      - "alfredo-source.yaml"
      - "cli/**"
      - "packages/**"
      - "schemas/**"
      - "scripts/install.ps1"
      - "skills/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/alfredo_cli.yaml"
      - "alfredo-source.yaml"
      - "cli/**"
      - "packages/**"
      - "schemas/**"
      - "scripts/install.ps1"
      - "skills/**"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: "3.12.0"

      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $tokens = $null
          $errors = $null
          $installer = Join-Path $env:GITHUB_WORKSPACE "scripts/install.ps1"
          [System.Management.Automation.Language.Parser]::ParseFile(
            $installer,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Test
        run: dart test

      - name: Validate canonical catalog
        env:
          ALFREDO_CONFIG_HOME: ${{ runner.temp }}/alfredo-config
          ALFREDO_USER_ROOT: ${{ runner.temp }}/alfredo-user
          ALFREDO_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          dart run bin/alfredo.dart source add canonical --local ..
          dart run bin/alfredo.dart source test canonical
          dart run bin/alfredo.dart package list
          dart run bin/alfredo.dart package show android-core
          dart run bin/alfredo.dart package install android-core --target generic --scope user
          dart run bin/alfredo.dart package status --target generic --scope user
          dart run bin/alfredo.dart package diff --target generic --scope user
          dart run bin/alfredo.dart package uninstall android-core --target generic --scope user

      - name: Compile native executable
        run: dart compile exe bin/alfredo.dart -o alfredo
